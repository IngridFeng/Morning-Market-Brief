name: Fetch Market Data

on:
  schedule:
    # 15:30 UTC ≈ 8:30 AM PDT (Mar–Nov) / 7:30 AM PST (Nov–Mar), weekdays.
    # Runs ~30 min before the 9 AM routine, so the data file is ready in time
    # even if GitHub's scheduler fires a few minutes late.
    - cron: "30 15 * * 1-5"
  workflow_dispatch:        # "Run workflow" button for testing

permissions:
  contents: write           # lets the workflow commit data/latest.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch market data
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python market_data.py

      - name: Commit data file
        run: |
          git config user.name  "market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Update market data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
